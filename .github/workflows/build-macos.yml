name: macOS Paketi

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Paketin yükleneceği release etiketi (örn. v1.3.0). Boş bırakılırsa yüklenmez."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: macOS uygulamasını oluştur
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      # Artifact deposu dolduğunda paket yine de release'e yüklenebilsin diye bu
      # adımın başarısızlığı derlemeyi düşürmez.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: GermanCourseAI-macOS
          path: dist/GermanCourseAI-macOS.zip
          if-no-files-found: error
      - name: Paketi release'e yükle
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/GermanCourseAI-macOS.zip --clobber -R "$REPO"
